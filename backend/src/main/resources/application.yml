spring:
  application:
    name: customer-activity-analytics
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/caa}
    username: ${DB_USER:caa}
    password: ${DB_PASSWORD:caa}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  ai:
    openai:
      # Empty default: no key means "no credential" - the clients are then built keyless and no
      # Authorization header is sent (local model servers ignore it; see OpenAiLlmClientFactory).
      api-key: ${OPENAI_API_KEY:}
      # Single lemonade router on holominix (port 13305) fronts every model and routes by model id.
      # Spring AI 2.x uses the official OpenAI SDK, which expects /v1 inside the base URL.
      base-url: ${LLM_BASE_URL:http://localhost:13305/api/v1}
      # Spring AI 2.0.1 defaults every OpenAI timeout to 60 seconds with 3 retries. That is wrong for
      # a local reasoning model: gpt-oss-120b writes 20-30 tokens a second and thinks before it
      # answers, so a single agent turn regularly needs one to three minutes. Left at 60s, every
      # long turn was cut off and retried until the run died with "OpenAIIoException: Request
      # failed" - measured, not guessed: four analyses of Viktor Semenov died exactly this way.
      #
      # These keys bound the shared OkHttp client. They are NOT sufficient on their own: whenever a
      # call supplies its own OpenAiChatOptions - which both the ReAct loop (it must attach tool
      # callbacks) and the rule judge do - OpenAiChatModel copies that object's timeout and retry
      # count into the SDK's per-request options, and OpenAiChatOptions.builder() bakes in 60s and
      # 3 retries. So the timeout is also set explicitly where those options are built, from
      # caa.agent.request-timeout and caa.rules.judge.timeout-seconds. Both halves are required.
      timeout: 10m
      max-retries: 1
      chat:
        options:
          model: ${LLM_CHAT_MODEL:gpt-oss-120b-GGUF}
          temperature: 0.1
          max-tokens: 4096
          timeout: 10m
      embedding:
        options:
          model: ${LLM_EMBED_MODEL:Qwen3-Embedding-4B-GGUF}
    vectorstore:
      pgvector:
        dimensions: 2560
        distance-type: cosine-distance
        index-type: hnsw
        table-name: document_chunks
        initialize-schema: false
        schema-validation: false

caa:
  security:
    jwt:
      # SIGNING SECRET. Set the JWT_SECRET environment variable to a private value:
      #   export JWT_SECRET="$(openssl rand -base64 48)"     (at least 32 bytes, HS256)
      # The fallback below exists so the demo starts with zero configuration, but it is
      # committed to this repository: with it in place anyone who has read the source can
      # forge a token for any account, admin included, without calling /api/auth/login.
      # JwtService logs a prominent WARNING at startup whenever this fallback is in use -
      # if you see that banner outside a local demo, the deployment is unprotected.
      secret: ${JWT_SECRET:change-me-in-production-this-is-a-demo-secret-key-of-sufficient-length-256bits}
      ttl-minutes: 480
    login-throttle:
      # Brute-force brake on POST /api/auth/login, counted per username + client address.
      # Documented limit: 5 failed attempts within 15 minutes lock that pair out for 5
      # minutes; a locked-out attempt is refused with 429 + Retry-After before the password
      # is checked. A successful sign-in clears the counter immediately, so a user who
      # mistypes and then gets it right is never delayed. In-memory and single-instance by
      # design - this is a demo brake, not edge infrastructure.
      max-attempts: 5
      window: 15m
      lock-duration: 5m
      max-tracked-pairs: 10000
  agent:
    # Ceiling on model turns of the orchestrator's closing summary conversation (which also doubles
    # as the historical bound of the old single-conversation loop). The per-rule work is bounded per
    # subagent by subagent-max-steps below.
    max-steps: 40
    # The run fans out into one rule subagent per applicable rule, each a fresh ReAct mini-loop that
    # must end by submitting its rule's verdict through evaluate_rule. subagent-max-steps bounds one
    # subagent's turns; a subagent that exhausts it without a verdict fails and is retried once on a
    # fresh conversation.
    subagent-max-steps: 12
    # How many rule subagents run at the same time. A local model server serialises requests anyway,
    # so this bounds the fan-out's shape (threads, transcripts, trace interleaving), not load on the
    # model backend - raise it only if the backend actually serves requests concurrently.
    subagent-parallelism: 3
    max-coverage-reprompts: 3
    # How many times one rule's condition may be re-expressed as SQL after a query was refused or
    # errored. Only failures count - a query that ran costs nothing here - so this bounds how long
    # the model may spend repairing one rule, never how many rules it may judge. Exhausting it does
    # NOT record the rule as "not triggered": the rule stays unjudged and the coverage gate fails
    # the run naming it, which is the whole point of the guarantee.
    max-rule-sql-attempts: 3
    # gpt-oss-120b advertises a 131072-token window, but the lemonade backend serving it was
    # started with ctx_size=32768 - that is the limit actually enforced, and exceeding it fails
    # the whole request with "500: Context size has been exceeded". Each subagent conversation is
    # compacted to fit this number. Raise it only if the model backend is restarted with a larger
    # window.
    context-tokens: 32768
    context-reserve-tokens: 1536
    keep-recent-messages: 10
    # One model turn. Generous because the bound that matters is max-steps, not the wall clock of a
    # single call: a turn that needs three minutes is normal here, and cutting it off costs the whole
    # run. See AgentProperties#requestTimeout for why this cannot be left to spring.ai.openai.timeout.
    request-timeout: 10m
    trace:
      # Directory the admin-enabled verbose agent trace (agent-trace-<timestamp>.log) is written to;
      # ../logs is where the run scripts already put the backend log. Tracing itself is toggled at
      # runtime via /api/admin/agent-trace and stays off until an admin enables it.
      dir: ${AGENT_TRACE_DIR:../logs}
  rules:
    judge:
      # "Test rule" in the admin editor: one model call that judges one draft condition against one
      # customer. Sized from measurement, not from hope - on the local gpt-oss-120b a judgement of a
      # 20-transaction scope generates ~2,000 completion tokens at ~20-30 tokens/second, of which
      # more than half is reasoning content that the server counts against max-tokens. A 1,536-token
      # budget therefore ran out mid-JSON and the whole answer was lost; 4,096 leaves room for the
      # thinking and the verdict, and the timeout has to cover the ~3 minutes that costs.
      # The browser waits longer than this (see RuleTester), so the honest 504 below always wins the
      # race against the client giving up.
      timeout-seconds: 240
      max-tokens: 4096
      max-transactions: 80
      temperature: 0.1
  sql:
    # The rule SQL layer: the agent writes a SELECT that answers a rule condition, PostgreSQL
    # computes the answer, and "triggered" is read off the result. That means model-authored SQL
    # runs against the customer database, so it runs as its own login role - see
    # db/migration/V5__readonly_role.sql - whose entire privilege set is SELECT on five views that
    # already contain nothing but the customer under analysis.
    #
    # This is NOT spring.datasource. It is a second, small pool that no transaction manager knows
    # about, and it must never be pointed at the owner role: the credentials below are the security
    # boundary, not a convenience.
    datasource:
      url: ${DB_URL:jdbc:postgresql://localhost:5432/caa}
      username: ${DB_READONLY_USER:caa_readonly}
      # Local-demo default, exactly like the caa/caa owner role above, and equally committed to the
      # repository. The shipped pg_hba trusts loopback so it protects nothing here - the privilege
      # set does. Anywhere the database is reachable over a network, set DB_READONLY_PASSWORD and
      # ALTER ROLE caa_readonly PASSWORD to match.
      password: ${DB_READONLY_PASSWORD:caa_readonly}
      pool-size: 3
      connection-timeout: 10s
    # Every legitimate rule query reads a few hundred rows of one customer's activity and answers in
    # single-digit milliseconds. Five seconds is therefore not a performance budget, it is the point
    # at which a query has stopped being a rule query - a cartesian product, a pg_sleep that somehow
    # got past the validator - and the server cancels it. Set on the transaction as a bound
    # parameter, on the role in V5, and again as a JDBC query timeout.
    statement-timeout: 5s
    # Cap on the ids carried back, not on the verdict: matchedCount is always the true total, so a
    # rule that matches 900 transactions still scores exactly the same as if all 900 were listed.
    max-matched-ids: 500
    max-fragment-chars: 8000
  cors:
    allowed-origins: http://localhost:5173

server:
  port: 8080

logging:
  level:
    com.sq.caa: DEBUG
