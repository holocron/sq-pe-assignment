spring:
  application:
    name: customer-activity-analytics
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/caa}
    username: ${DB_USER:caa}
    password: ${DB_PASSWORD:caa}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:none}
      # Single lemonade router on holominix (port 13305) fronts every model and routes by model id.
      # Spring AI 2.x uses the official OpenAI SDK, which expects /v1 inside the base URL.
      base-url: ${LLM_BASE_URL:http://localhost:13305/api/v1}
      chat:
        options:
          model: ${LLM_CHAT_MODEL:gpt-oss-120b-GGUF}
          temperature: 0.1
          max-tokens: 4096
      embedding:
        options:
          model: ${LLM_EMBED_MODEL:Qwen3-Embedding-4B-GGUF}
    vectorstore:
      pgvector:
        dimensions: 2560
        distance-type: cosine-distance
        index-type: hnsw
        table-name: document_chunks
        initialize-schema: false
        schema-validation: false

caa:
  security:
    jwt:
      # SIGNING SECRET. Set the JWT_SECRET environment variable to a private value:
      #   export JWT_SECRET="$(openssl rand -base64 48)"     (at least 32 bytes, HS256)
      # The fallback below exists so the demo starts with zero configuration, but it is
      # committed to this repository: with it in place anyone who has read the source can
      # forge a token for any account, admin included, without calling /api/auth/login.
      # JwtService logs a prominent WARNING at startup whenever this fallback is in use -
      # if you see that banner outside a local demo, the deployment is unprotected.
      secret: ${JWT_SECRET:change-me-in-production-this-is-a-demo-secret-key-of-sufficient-length-256bits}
      ttl-minutes: 480
    login-throttle:
      # Brute-force brake on POST /api/auth/login, counted per username + client address.
      # Documented limit: 5 failed attempts within 15 minutes lock that pair out for 5
      # minutes; a locked-out attempt is refused with 429 + Retry-After before the password
      # is checked. A successful sign-in clears the counter immediately, so a user who
      # mistypes and then gets it right is never delayed. In-memory and single-instance by
      # design - this is a demo brake, not edge infrastructure.
      max-attempts: 5
      window: 15m
      lock-duration: 5m
      max-tracked-pairs: 10000
  agent:
    max-steps: 40
    max-coverage-reprompts: 3
    # gpt-oss-120b advertises a 131072-token window, but the lemonade backend serving it was
    # started with ctx_size=32768 - that is the limit actually enforced, and exceeding it fails
    # the whole request with "500: Context size has been exceeded". A full analysis is ~30 turns
    # of accumulating tool output, so the transcript is compacted to fit this number. Raise it
    # only if the model backend is restarted with a larger window.
    context-tokens: 32768
    context-reserve-tokens: 1536
    keep-recent-messages: 10
  cors:
    allowed-origins: http://localhost:5173

server:
  port: 8080

logging:
  level:
    com.sq.caa: DEBUG
